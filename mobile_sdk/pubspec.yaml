name: com.lapang.emergency.sdk
description: "Platform Client Standalone Android SDK LAPANG - Command Push Alert Geofencing Receiver"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Native & Core dependencies
  cupertino_icons: ^1.0.6
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.2.6



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gdc-jvc-mobile-banner.jpg
    - assets/lapang-logo-white-loc1.svg

